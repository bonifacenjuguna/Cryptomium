[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Your Railway backend address. A value set in the Netlify UI overrides this.
  API_URL = "https://priceping-production-7baf.up.railway.app"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
