<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2b01e">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme-init.js"></script>
  <title>{{BRAND}} — Preferences</title>
</head>
<body>
<!--@header-->
<main id="main">
  <div class="wrap settings-page">
    <a class="back" href="/">← Back to markets</a>
    <h1>Preferences</h1>
    <p class="lede">Choose how {{BRAND}} displays prices and the site theme.</p>
    <div class="settings-list">
      <section class="settings-item">
        <div>
          <h2>Currency</h2>
          <p>Display prices in your preferred currency.</p>
        </div>
        <label class="select">
          <span class="sr">Currency</span>
          <select id="currency"><option value="USD">USD</option></select>
        </label>
      </section>
      <section class="settings-item">
        <div>
          <h2>Theme</h2>
          <p>Switch between light and dark mode.</p>
        </div>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        </button>
      </section>
    </div>
  </div>
</main>
<!--@footer-->
<script type="module">
  import { initChrome } from '/js/common.js';
  initChrome();
</script>
</body>
</html>
