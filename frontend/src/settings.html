<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2b01e">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme-init.js"></script>
  <title>{{BRAND}} — Preferences</title>
</head>
<body>
<!--@header-->
<main id="main">
  <div class="wrap settings-page">
    <a class="back settings-back" href="/">← Back to markets</a>

    <header class="settings-heading">
      <p class="settings-eyebrow">Settings</p>
      <h1>Preferences</h1>
      <p class="lede">Choose how {{BRAND}} looks and how prices are shown.</p>
    </header>

    <section class="settings-section" aria-labelledby="display-heading">
      <div class="settings-section-head">
        <div>
          <h2 id="display-heading">Display</h2>
          <p>These choices are saved on this device.</p>
        </div>
      </div>

      <div class="settings-list">
        <div class="settings-item">
          <div class="settings-copy">
            <h3>Currency</h3>
            <p>Change the currency used for market prices.</p>
          </div>
          <label class="select settings-control">
            <span class="sr">Currency</span>
            <select id="currency"><option value="USD">USD</option></select>
          </label>
        </div>

        <div class="settings-item">
          <div class="settings-copy">
            <h3>Theme</h3>
            <p>Choose between the light and dark interface.</p>
          </div>
          <button class="icon-btn settings-theme" id="theme-toggle" type="button" aria-label="Switch theme">
            <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
          </button>
        </div>
      </div>
    </section>
  </div>
</main>
<!--@footer-->
<script type="module">
  import { initChrome } from '/js/common.js';
  initChrome();
</script>
</body>
</html>
