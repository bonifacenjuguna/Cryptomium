<a class="sr" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="/" aria-label="{{BRAND}} home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l12 7v14l-12 7L4 23V9z" fill="#F2B01E"/><path d="M16 2l12 7-12 7L4 9z" fill="#fff" fill-opacity=".42"/><path d="M16 16v14L4 23V9z" fill="#000" fill-opacity=".16"/></svg>
      <span>{{BRAND}}</span>
    </a>
    <nav class="nav" id="main-nav" aria-label="Main">
      <a href="/#markets" data-nav="markets">Markets</a>
      <a href="/#alerts" data-nav="alerts">Alerts</a>
      <a href="/about" data-nav="about">About</a>
      <a href="/settings" data-nav="settings">Preferences</a>
    </nav>
    <div class="tools">
      <div class="search" id="search">
        <button class="icon-btn search-toggle" id="search-toggle" type="button" aria-label="Search coins" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <input id="search-input" type="search" placeholder="Search coins" autocomplete="off" spellcheck="false" aria-label="Search coins" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-list">
        <ul class="search-list" id="search-list" role="listbox" aria-label="Matching coins" hidden></ul>
      </div>
      <a class="btn btn-accent btn-sm" href="{{CHANNEL_URL}}" target="_blank" rel="noopener">Join<span class="hide-sm">&nbsp;{{CHANNEL_HANDLE}}</span></a>
    </div>
    <button class="icon-btn menu-toggle" id="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</header>
