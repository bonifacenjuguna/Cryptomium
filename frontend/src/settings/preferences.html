<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2b01e">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme-init.js"></script>
  <title>Preferences | {{BRAND}}</title>
  <meta name="description" content="The defaults the app opens with. Changes apply straight away.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{SITE_URL}}/settings/preferences">
</head>
<body data-page="preferences">
<!--@header-->
<main id="main">
  <div class="wrap">
    <a class="crumb" href="/settings">Settings</a>
    <div class="settings-layout has-aside">
      <!--@settings-nav-->
      <div class="settings-body">
        <div class="s-head"><h1>Preferences</h1></div>

        <section class="s-card" aria-labelledby="h-chart">
          <h2 id="h-chart">Charts and markets</h2>
          <div class="s-row"><div class="s-label"><b>Open the app on</b></div><select id="start-tab" data-select="startTab" hidden aria-label="Open the app on"><option value="home">Home</option><option value="markets">Overview</option><option value="screener">Screener</option><option value="news">News</option><option value="portfolio">Portfolio</option><option value="last">Where I left off</option></select></div>
          <div class="s-row">
            <div class="s-label"><b>Chart style</b></div>
            <div class="segs" role="radiogroup" aria-label="Chart style" data-pref="chartType"><button type="button" role="radio" class="seg" data-value="line">Line</button><button type="button" role="radio" class="seg" data-value="candles">Candles</button></div>
          </div>
          <div class="s-row">
            <div class="s-label"><b>Chart range</b></div>
            <div class="segs" role="radiogroup" aria-label="Chart range" data-pref="chartRange"><button type="button" role="radio" class="seg" data-value="24h">24H</button><button type="button" role="radio" class="seg" data-value="7d">7D</button><button type="button" role="radio" class="seg" data-value="30d">30D</button><button type="button" role="radio" class="seg" data-value="90d">90D</button><button type="button" role="radio" class="seg" data-value="1y">1Y</button></div>
          </div>
          <div class="s-row">
            <div class="s-label"><b>Markets view</b></div>
            <div class="segs" role="radiogroup" aria-label="Markets view" data-pref="homeTab"><button type="button" role="radio" class="seg" data-value="all">All</button><button type="button" role="radio" class="seg" data-value="fav">Starred</button><button type="button" role="radio" class="seg" data-value="up">Gainers</button><button type="button" role="radio" class="seg" data-value="down">Losers</button></div>
          </div>
        </section>

        <section class="s-card" aria-labelledby="h-num">
          <h2 id="h-num">Numbers</h2>
          <div class="s-row">
            <div class="s-label"><b>Number detail</b></div>
            <div class="segs" role="radiogroup" aria-label="Number detail" data-pref="precision"><button type="button" role="radio" class="seg" data-value="auto">Standard</button><button type="button" role="radio" class="seg" data-value="extra">More detail</button></div>
          </div>
          <div class="s-row">
            <div class="s-label"><b>Price in the tab</b></div>
            <button type="button" class="switch" role="switch" data-toggle="tabPrice" aria-checked="false" aria-label="Price in the tab"><span></span></button>
          </div>
        </section>

        <section class="s-card" aria-labelledby="h-touch">
          <h2 id="h-touch">Touch</h2>
          </section>

        <div class="s-actions"><button type="button" class="btn btn-ghost" id="reset-prefs">Reset preferences</button></div>

        <div class="s-actions"><span class="s-saved" id="saved" aria-live="polite"></span></div>
      </div>
      <aside class="s-aside" aria-label="Live preview">
        <div class="pv">
          <div class="pv-label"><span class="pv-dot"></span>Live preview</div>
          <div class="pv-card">
            <div class="pv-tape" id="pv-tape" aria-hidden="true"></div>
            <div class="pv-head">
              <span class="pv-logo" id="pv-logo"></span>
              <span class="pv-name"><b>BTC</b><span>Bitcoin</span></span>
              <span class="pv-price"><b class="num" id="pv-price">–</b><span class="chg num flat" id="pv-chg">&nbsp;</span></span>
            </div>
            <div class="chart pv-chart" id="pv-chart"></div>
            <div class="pv-tabs" id="pv-tabs" aria-hidden="true"><span data-r="24h">24H</span><span data-r="7d">7D</span><span data-r="30d">30D</span><span data-r="90d">90D</span><span data-r="1y">1Y</span></div>
            <div class="pv-btns"><span class="btn btn-accent btn-sm">Set alert</span><span class="btn btn-ghost btn-sm">Compare</span></div>
          </div>
          <p class="pv-note">This is a small copy of the site. It changes as you change your settings.</p>
        </div>
      </aside>
    </div>
  </div>
</main>
<!--@footer-->
<script src="/config.js"></script>
<script type="module" src="/js/settings.js"></script>
</body>
</html>
