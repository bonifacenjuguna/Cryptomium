<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2b01e">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme-init.js"></script>
  <title>Accessibility | {{BRAND}}</title>
  <meta name="description" content="Text size, colours, contrast and touch options.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{SITE_URL}}/settings/accessibility">
</head>
<body data-page="accessibility">
<!--@header-->
<main id="main">
  <div class="wrap">
    <a class="crumb" href="/settings">Settings</a>
    <div class="settings-layout">
      <!--@settings-nav-->
      <div class="settings-body">
        <div class="s-head"><h1>Accessibility</h1></div>
        <section class="s-card" aria-labelledby="h-see">
          <h2 id="h-see">Seeing</h2>
          <div class="s-row"><div class="s-label"><b>Text size</b></div><div class="segs" role="radiogroup" aria-label="Text size" data-pref="textSize"><button type="button" role="radio" class="seg" data-value="default" aria-checked="false">Default</button><button type="button" role="radio" class="seg" data-value="large" aria-checked="false">Large</button><button type="button" role="radio" class="seg" data-value="larger" aria-checked="false">Larger</button></div></div>
          <div class="s-row"><div class="s-label"><b>Up and down colours</b></div><div class="segs" role="radiogroup" aria-label="Up and down colours" data-pref="palette"><button type="button" role="radio" class="seg" data-value="classic" aria-checked="false">Green and red</button><button type="button" role="radio" class="seg" data-value="clear" aria-checked="false">Blue and orange</button></div></div>
          <div class="s-row"><div class="s-label"><b>High contrast</b></div><button type="button" class="switch" role="switch" data-toggle="contrast" aria-checked="false" aria-label="High contrast"><span></span></button></div>
        </section>
        <section class="s-card" aria-labelledby="h-move">
          <h2 id="h-move">Moving and touching</h2>
          <div class="s-row"><div class="s-label"><b>Animations</b></div><button type="button" class="switch" role="switch" data-toggle="motion" aria-checked="false" aria-label="Animations"><span></span></button></div>
          <div class="s-row"><div class="s-label"><b>Bigger tap targets</b></div><button type="button" class="switch" role="switch" data-toggle="bigTouch" aria-checked="false" aria-label="Bigger tap targets"><span></span></button></div>
          <div class="s-row"><div class="s-label"><b>Touch feedback</b></div><button type="button" class="switch" role="switch" data-toggle="haptics" aria-checked="false" aria-label="Touch feedback"><span></span></button></div>
          <div class="s-row"><div class="s-label"><b>Select text</b></div><button type="button" class="switch" role="switch" data-toggle="selectText" aria-checked="false" aria-label="Select text"><span></span></button></div>
        </section>
        <div class="s-actions"><button type="button" class="btn btn-ghost" data-reset="textSize,palette,contrast,motion,bigTouch,haptics,selectText">Reset this page</button></div>
        <div class="s-actions"><span class="s-saved" id="saved" aria-live="polite"></span></div>
      </div>
    </div>
  </div>
</main>
<!--@footer-->
<script src="/config.js"></script>
<script type="module" src="/js/settings.js"></script>
</body>
</html>
