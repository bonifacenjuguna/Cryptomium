<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2b01e">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme-init.js"></script>
  <title>Advanced | {{BRAND}}</title>
  <meta name="description" content="Fine control over how Cryptomium updates and behaves.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{SITE_URL}}/settings/advanced">
</head>
<body data-page="advanced">
<!--@header-->
<main id="main">
  <div class="wrap">
    <a class="crumb" href="/settings">Settings</a>
    <div class="settings-layout">
      <!--@settings-nav-->
      <div class="settings-body">
        <div class="s-head"><h1>Advanced</h1></div>
        <section class="s-card" aria-labelledby="h-beh">
          <h2 id="h-beh">Behaviour</h2>
          <div class="s-row">
            <div class="s-label"><b>Keyboard shortcuts</b></div>
            <button type="button" class="switch" role="switch" data-toggle="shortcuts" aria-checked="false" aria-label="Keyboard shortcuts"><span></span></button>
          </div>
        </section>

        <section class="s-card" aria-labelledby="h-maint">
          <h2 id="h-maint">Maintenance</h2>
          <div class="s-row"><div class="s-label"><b>Report a problem</b></div><button type="button" class="btn btn-ghost btn-sm" id="diag-copy">Copy</button></div>
          <div class="s-row">
            <div class="s-label"><b>Clear recent searches</b></div>
            <button type="button" class="btn btn-ghost btn-sm" id="clear-recent">Clear</button>
          </div>
          <div class="s-row">
            <div class="s-label"><b>Refresh the page</b></div>
            <button type="button" class="btn btn-ghost btn-sm" id="reload-now">Refresh now</button>
          </div>
    </div>
  </div>
</main>
<!--@footer-->
<script src="/config.js"></script>
<script type="module" src="/js/settings.js"></script>
</body>
</html>
