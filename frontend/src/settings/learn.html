<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2b01e">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme-init.js"></script>
  <title>Learn crypto | {{BRAND}}</title>
  <meta name="description" content="Short, plain-language guides and a glossary you can search.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{SITE_URL}}/settings/learn">
</head>
<body data-page="learn">
<!--@header-->
<main id="main">
  <div class="wrap">
    <a class="crumb" href="/settings">Settings</a>
    <div class="settings-layout">
      <!--@settings-nav-->
      <div class="settings-body">
        <div class="s-head"><h1>Learn crypto</h1><p class="lede">Short, plain-language guides and a glossary you can search.</p></div>
        <section class="s-card" aria-labelledby="h-start">
          <h2 id="h-start">Start here</h2>
          <div class="lessons" id="lessons" data-selectable></div>
        </section>

        <section class="s-card" aria-labelledby="h-gloss">
          <h2 id="h-gloss">Glossary</h2>
          <label class="wl-search"><span class="sr">Search the glossary</span><input id="gl-search" type="search" placeholder="Search a word, like staking" autocomplete="off"></label>
          <div class="gl-cats" id="gl-cats" role="group" aria-label="Topic"></div>
          <dl class="gloss" id="gloss" data-selectable></dl>
          <p class="empty" id="gl-empty" hidden>No word matches that.</p>
        </section>

        <p class="s-hint tagline">Market information only, not financial advice. Prices can differ between exchanges.</p>
        <div class="s-actions"><span class="s-saved" id="saved" aria-live="polite"></span></div>
      </div>
    </div>
  </div>
</main>
<!--@footer-->
<script src="/config.js"></script>
<script type="module" src="/js/settings.js"></script>
</body>
</html>
