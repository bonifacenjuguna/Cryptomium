<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2b01e">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme-init.js"></script>
  <title>Price alerts | {{BRAND}}</title>
  <meta name="description" content="Get told when a coin reaches the price you set.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{SITE_URL}}/settings/alerts">
</head>
<body data-page="alerts">
<!--@header-->
<main id="main">
  <div class="wrap">
    <a class="crumb" href="/settings">Settings</a>
    <div class="settings-layout">
      <!--@settings-nav-->
      <div class="settings-body">
        <div class="s-head"><h1>Price alerts</h1><p class="lede">Get told when a coin reaches the price you set.</p></div>
        <section class="s-card" aria-labelledby="h-new">
          <h2 id="h-new">New alert</h2>
          <form id="al-form" class="al-builder" autocomplete="off" novalidate>
            <div class="fld"><span>Coin</span><button class="cpk" id="al-coin" type="button"></button></div>
            <div class="fld"><span>Tell me when it</span>
              <div class="al-types" id="al-types" role="radiogroup" aria-label="Alert type">
                <button type="button" role="radio" aria-checked="true" data-kind="above"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg>Rises to</button>
                <button type="button" role="radio" aria-checked="false" data-kind="below"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>Falls to</button>
                <button type="button" role="radio" aria-checked="false" data-kind="move"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M7 4 4 7M7 4l3 3M17 20V4M17 20l-3-3M17 20l3-3"/></svg>Moves 24h</button>
                <button type="button" role="radio" aria-checked="false" data-kind="ath"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>New high</button>
                <button type="button" role="radio" aria-checked="false" data-kind="atl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V8M6 15l6 6 6-6M5 4h14"/></svg>New low</button>
              </div>
            </div>
            <select id="al-dir" hidden aria-label="Alert type"><option value="above">Rises to or above</option><option value="below">Falls to or below</option><option value="move">Moves by % in 24h</option><option value="ath">Hits a new all-time high</option><option value="atl">Hits a new all-time low</option></select>
            <div class="fld" id="al-price-fld"><span id="al-price-l">Price in <b id="al-code">USD</b></span>
              <span class="al-input"><i id="al-sym">$</i><input id="al-price" type="text" inputmode="decimal" placeholder="0.00" aria-label="Target price" aria-describedby="al-now"></span>
            </div>
            <div class="al-chips" id="al-chips" role="group" aria-label="Quick targets"></div>
            <p class="al-preview" id="al-now" aria-live="polite">&nbsp;</p>
            <p class="s-error" id="al-error" role="alert" hidden></p>
            <button class="btn btn-accent al-add" type="submit">Add alert</button>
          </form>
        </section>

        <section class="s-card" aria-labelledby="h-list">
          <h2 id="h-list">Your alerts</h2>
          <ul class="al-list" id="al-list"></ul>
          <p class="empty" id="al-empty" hidden>No alerts yet. Add one above, or from any coin page.</p>
        </section>

        <p class="s-hint al-more">Push, sound and vibration are in <a href="/settings/notifications">Notifications</a>.</p>

        <div class="s-actions"><span class="s-saved" id="saved" aria-live="polite"></span></div>
      </div>
    </div>
  </div>
</main>
<!--@footer-->
<script src="/config.js"></script>
<script type="module" src="/js/settings.js"></script>
</body>
</html>
