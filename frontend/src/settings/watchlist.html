<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2b01e">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme-init.js"></script>
  <title>Watchlist | {{BRAND}}</title>
  <meta name="description" content="Choose the coins you follow. They appear under Starred on the home page.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{SITE_URL}}/settings/watchlist">
</head>
<body data-page="watchlist">
<!--@header-->
<main id="main">
  <div class="wrap">
    <a class="crumb" href="/settings">Settings</a>
    <div class="settings-layout">
      <!--@settings-nav-->
      <div class="settings-body">
        <div class="s-head"><h1>Watchlist</h1></div>
        <section class="wl-mine" aria-labelledby="h-mine">
          <div class="wl-sec"><h2 id="h-mine">Following</h2><span class="wl-n num" id="wl-count">&nbsp;</span><button type="button" class="btn btn-ghost btn-sm" id="wl-clear" hidden>Clear all</button></div>
          <ul class="wl-cards" id="wl-mine"></ul>
          <div class="wl-empty" id="wl-empty" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
            <b>Your watchlist is empty</b>
            <span>Tap the star beside any coin below to follow it. Followed coins show up here with their live price.</span>
          </div>
        </section>
        <section class="wl-more" aria-labelledby="h-more">
          <div class="wl-sec"><h2 id="h-more">Add coins</h2></div>
          <label class="wl-search"><span class="sr">Filter coins</span><input id="wl-filter" type="search" placeholder="Search coins to follow" autocomplete="off"></label>
          <ul class="wl-chips" id="wl-list"></ul>
        </section>

        <div class="s-actions"><span class="s-saved" id="saved" aria-live="polite"></span></div>
      </div>
    </div>
  </div>
</main>
<!--@footer-->
<script src="/config.js"></script>
<script type="module" src="/js/settings.js"></script>
</body>
</html>
